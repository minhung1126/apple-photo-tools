name: Test macOS photo organizer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax and executable bit
        shell: zsh {0}
        run: |
          zsh -n photo-organize.command
          test -x photo-organize.command

      - name: Install ExifTool
        run: brew install exiftool

      - name: Behavioral test
        shell: zsh {0}
        run: |
          set -eu
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT

          cp -p photo-organize.command "$test_root/photo-organize.command"

          # Tiny valid JPEG used for metadata-sensitive tests.
          jpeg_b64=''
          make_jpeg() {
            print -r -- "$jpeg_b64" | base64 --decode > "$1"
            exiftool -overwrite_original -DateTimeOriginal='2026:09:25 14:25:30' -CreateDate='2026:09:25 14:25:30' "$1" >/dev/null
          }

          mkdir -p "$test_root/20260910 QWER"
          printf 'ORIGINAL-HEIC' > "$test_root/20260910 QWER/IMG_1234.HEIC"
          printf 'EDITED-JPG'   > "$test_root/20260910 QWER/IMG_E1234.JPG"
          printf 'AAE-DATA'     > "$test_root/20260910 QWER/IMG_1234.AAE"
          printf 'UNCHANGED'    > "$test_root/20260910 QWER/IMG_5678.HEIC"
          printf 'TOPIC-ODD'     > "$test_root/20260910 QWER/topic odd.jpg"
          printf 'TOPIC-UUID'    > "$test_root/20260910 QWER/A8F21D3C-91AE-4F44.JPG"

          # Same-extension case: this verifies the original is archived before
          # the edited file claims the original IMG_#### name.
          printf 'ORIGINAL-SAME-EXT' > "$test_root/20260910 QWER/IMG_2222.HEIC"
          printf 'EDITED-SAME-EXT'   > "$test_root/20260910 QWER/IMG_E2222.HEIC"

          # Loose files in root: daily media must be renamed after monthly filing.
          make_jpeg "$test_root/IMG_9999.JPG"

          # Daily Live Photo pair must keep a shared timestamp prefix.
          make_jpeg "$test_root/IMG_8888.JPG"
          printf 'LIVE-MOV' > "$test_root/IMG_8888.MOV"

          # Edited pair in root must first move into YYYYMM00, then be processed there.
          make_jpeg "$test_root/IMG_3333.JPG"
          cp "$test_root/IMG_3333.JPG" "$test_root/IMG_E3333.JPG"
          printf 'ROOT-AAE' > "$test_root/IMG_3333.AAE"

          # Non-standard name (including a space) must receive a capture-time prefix.
          make_jpeg "$test_root/odd name.jpg"

          # No capture metadata: must warn and remain untouched in root.
          printf 'NO-METADATA' > "$test_root/no metadata.jpg"

          month_dir="$(date +%Y%m)00"

          (
            cd "$test_root"
            # Stage 1 = YES, stage 2 = YES, stage 3 = YES, final pause = blank line.
            printf 'YES\nYES\nYES\n\n' | ./photo-organize.command
          )

          test -d "$test_root/20260910 QWER"
          test "$(cat "$test_root/20260910 QWER/IMG_1234.JPG")" = "EDITED-JPG"
          test "$(cat "$test_root/20260910 QWER/Originals/IMG_1234.HEIC")" = "ORIGINAL-HEIC"
          test "$(cat "$test_root/20260910 QWER/Originals/AAE/IMG_1234.AAE")" = "AAE-DATA"
          test "$(cat "$test_root/20260910 QWER/IMG_5678.HEIC")" = "UNCHANGED"

          test "$(cat "$test_root/20260910 QWER/topic odd.jpg")" = "TOPIC-ODD"
          test "$(cat "$test_root/20260910 QWER/A8F21D3C-91AE-4F44.JPG")" = "TOPIC-UUID"
          renamed_topic_odd=("$test_root/20260910 QWER"/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9]_topic\ odd.jpg(N))
          test "${#renamed_topic_odd[@]}" -eq 0

          test "$(cat "$test_root/20260910 QWER/IMG_2222.HEIC")" = "EDITED-SAME-EXT"
          test "$(cat "$test_root/20260910 QWER/Originals/IMG_2222.HEIC")" = "ORIGINAL-SAME-EXT"

          daily_img=("$test_root/$month_dir"/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9]_IMG_9999.JPG(N))
          test "${#daily_img[@]}" -eq 1
          test -s "$daily_img[1]"
          test ! -e "$test_root/$month_dir/IMG_9999.JPG"

          daily_edit=("$test_root/$month_dir"/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9]_IMG_3333.JPG(N))
          test "${#daily_edit[@]}" -eq 1
          test -s "$daily_edit[1]"
          test -s "$test_root/$month_dir/Originals/IMG_3333.JPG"
          test "$(cat "$test_root/$month_dir/Originals/AAE/IMG_3333.AAE")" = "ROOT-AAE"

          live_image=("$test_root/$month_dir"/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9]_IMG_8888.JPG(N))
          live_mov=("$test_root/$month_dir"/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9]_IMG_8888.MOV(N))
          test "${#live_image[@]}" -eq 1
          test "${#live_mov[@]}" -eq 1
          test "${live_image[1]%_IMG_8888.JPG}" = "${live_mov[1]%_IMG_8888.MOV}"
          test -s "$live_image[1]"
          test "$(cat "$live_mov[1]")" = "LIVE-MOV"

          renamed=("$test_root/$month_dir"/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9]_odd\ name.jpg(N))
          test "${#renamed[@]}" -eq 1
          test -s "$renamed[1]"

          test -e "$test_root/no metadata.jpg"
          no_metadata_moved=("$test_root"/[0-9][0-9][0-9][0-9][0-9][0-9]00/no\ metadata.jpg(N))
          test "${#no_metadata_moved[@]}" -eq 0
